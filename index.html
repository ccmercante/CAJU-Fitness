<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CAJU Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EDE1;--surface:#FFFDF8;--surface2:#F7F3E9;--ink:#2B2E24;--muted:#6F7262;--line:#E2DCCB;--olive:#56663F;--olive-ink:#fff;--sage:#A7B596;--sage-soft:#E4EAD8;--earth:#8A7054;--terra:#B5593F;--terra-soft:#F3DFD6;--ok:#56663F;--no:#B5593F;--c:#56663F;--j:#8A7054;
 --disp:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;--body:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1F17;--surface:#252921;--surface2:#2C3126;--ink:#ECE8DB;--muted:#A5A895;--line:#3A3F31;--olive:#9DB07F;--olive-ink:#1C1F17;--sage:#6E7F59;--sage-soft:#323A28;--earth:#C2A582;--terra:#E08A6C;--terra-soft:#4A2F27;--ok:#9DB07F;--no:#E08A6C;--c:#9DB07F;--j:#C2A582}}
:root[data-theme="dark"]{--bg:#1C1F17;--surface:#252921;--surface2:#2C3126;--ink:#ECE8DB;--muted:#A5A895;--line:#3A3F31;--olive:#9DB07F;--olive-ink:#1C1F17;--sage:#6E7F59;--sage-soft:#323A28;--earth:#C2A582;--terra:#E08A6C;--terra-soft:#4A2F27;--ok:#9DB07F;--no:#E08A6C;--c:#9DB07F;--j:#C2A582}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px}
.title{font-size:24px;margin:18px 4px 8px}
.muted{color:var(--muted);margin:4px 4px 12px}.small{font-size:13px}
.foot{color:var(--muted);font-size:13px;margin:14px 6px 8px}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--olive)}
.menu{position:relative}
.who{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.pop{position:absolute;right:0;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:180px;box-shadow:0 10px 30px rgba(40,40,20,.14)}
.pop button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;font-weight:600}
.pop button:active{background:var(--sage-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.who .dot{margin:0}.dot.c{background:var(--c)}.dot.j{background:var(--j)}
.banner{margin:4px 16px 0;padding:10px 14px;border-radius:14px;background:var(--terra-soft);color:var(--terra);font-size:13.5px;font-weight:600}
.view{padding:6px 16px 112px}
/* cartões e botões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:15px;font-weight:700;text-align:center}
.btn.wide{width:100%;margin-top:10px}.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--olive);color:var(--olive-ink)}
.btn.soft{background:var(--sage-soft);color:var(--olive)}
.btn.ghost{border:1.5px solid var(--line);background:transparent}
.btn.danger{background:var(--terra-soft);color:var(--terra)}
.btn:active{transform:scale(.98)}
.link{color:var(--olive);font-weight:700;font-size:14px;min-height:36px;padding:0 4px}.link.mute{color:var(--muted);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:24px;line-height:1}
.x{width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:22px}
/* semana e dias */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.weeklabel{text-align:center;display:flex;flex-direction:column;align-items:center;font-family:var(--disp)}
.weeklabel b{font-size:17px}.weeklabel small{color:var(--muted);font-family:var(--body);font-size:13px}.weeklabel .link{font-size:13px;min-height:24px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:15px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);position:relative}
.day b{font-size:17px;color:var(--ink);font-family:var(--disp)}
.day.on{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}.day.on b{color:var(--olive-ink)}
.day.today::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--terra)}
.dayh{font-size:20px;margin:14px 4px 0}.dayhrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:6px}.dayhrow .dayh{margin-bottom:0}.btn.small{min-height:40px;padding:0 14px;font-size:14px}
/* refeição */
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pname-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.pname-row .pname{margin:0}.vsel{display:flex;margin:4px 0 10px}.vsel button{flex:1}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{min-height:40px;padding:0 14px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--olive);color:var(--olive-ink)}
.seg button.on.ok{background:var(--ok)}.seg button.on.no{background:var(--no);color:#fff}
.note{margin:0 0 8px;padding:8px 12px;border-radius:12px;background:var(--terra-soft);color:var(--terra);font-size:13.5px;font-weight:600}
.pbox{border-top:1px solid var(--line);padding:12px 0 4px}.pbox.ordered .items{opacity:.55}
.pname{font-weight:700;margin-bottom:6px}
.optline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--sage-soft);color:var(--olive);font-size:12px;font-weight:700;margin-left:4px}.tag.terra{background:var(--terra-soft);color:var(--terra)}
.items{list-style:none;margin:6px 0 10px;padding:0}
.items li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.items li:last-child{border-bottom:0}.items em{font-style:normal;color:var(--muted);font-size:14px;text-align:right}
.items li.sw span{color:var(--olive);font-weight:700}.items small{width:100%;color:var(--terra);font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1;min-width:150px}
.acts2{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:4px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(30,32,22,.45);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:88vh;z-index:41;background:var(--surface);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.close{position:absolute;right:12px;top:10px;width:40px;height:40px;font-size:26px;color:var(--muted)}
.sbody{overflow:auto;padding:12px 18px 22px;-webkit-overflow-scrolling:touch}
.sbody h3{font-size:20px;margin-right:36px}
.optlist{display:flex;flex-direction:column;gap:8px}
.optcard{text-align:left;padding:13px 15px;border-radius:16px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:3px}
.optcard span{color:var(--muted);font-size:14px}.optcard small{color:var(--terra);font-weight:600}
.optcard.on{border-color:var(--olive);background:var(--sage-soft)}
.acc{border:1px solid var(--line);border-radius:16px;margin:8px 0;background:var(--surface2)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:56px}
.acc summary::-webkit-details-marker{display:none}
.acc summary div{display:flex;flex-direction:column;min-width:0}.acc summary span{color:var(--muted);font-size:13.5px}
.acc summary i{font-style:normal;color:var(--olive);font-size:13px;font-weight:700;white-space:nowrap}
.subs{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;background:var(--surface);border:1.5px solid transparent;min-height:48px}
.subrow em{font-style:normal;color:var(--muted);font-size:13.5px;text-align:right}
.subrow.on{border-color:var(--olive);background:var(--sage-soft)}.subrow.on span{font-weight:700}
/* listas */
.list{list-style:none;margin:0;padding:0}.card>.list{margin:-4px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}.row.tap{cursor:pointer}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}.rt small{color:var(--muted);font-size:13px}
.qty{font-weight:700;white-space:nowrap;text-align:right}.qty small.un{display:block;font-size:12px;font-weight:600;color:var(--muted)}.rt.tap,.qty.tap{cursor:pointer}.sec .cnt{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}.chev{color:var(--muted);font-size:22px}
.row.done .rt b{text-decoration:line-through;color:var(--muted)}.row.done .qty{color:var(--muted)}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--sage);flex:none;display:grid;place-items:center;background:var(--surface)}
.chk svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:var(--olive);border-color:var(--olive)}.chk.on svg{opacity:1;stroke:var(--olive-ink)}
.tick{width:30px;text-align:center;color:var(--olive);font-weight:800}
.sec{font-size:17px;margin:20px 4px 0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.summary b{display:block;font-family:var(--disp);font-size:28px;color:var(--olive)}.summary span{font-size:12.5px;color:var(--muted)}
.okbox summary{font-weight:700;color:var(--olive);cursor:pointer;min-height:32px;display:flex;align-items:center}
.empty{text-align:center;color:var(--muted)}.empty b{color:var(--ink)}.empty p{margin:6px 0 0}
/* formulários */
.fl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;margin-top:12px;color:var(--muted)}
.fl input,.fl select{min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600}
.chip.on{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
/* diário */
.drow{padding:12px 0;border-top:1px solid var(--line)}.drow:first-of-type{border-top:0}
.dl{display:flex;flex-direction:column;margin-bottom:8px}.dl small{color:var(--muted)}
.seg.two{display:grid;grid-template-columns:1fr 1fr;width:100%}
.acts-l{margin-top:10px}
/* score */
.sc-grid{gap:10px}.sc{text-align:center;padding:14px 12px;margin:0}
.sc-h{font-weight:700;display:flex;align-items:center;justify-content:center}
.sc .big{font-family:var(--disp);font-weight:800;font-size:56px;line-height:1.05;margin-top:6px;color:var(--olive)}
.sc.lead{border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}.sc.lead .big{color:var(--terra)}
.sc>small{color:var(--muted)}
.bars{margin-top:12px;text-align:left}.bar{margin-top:9px}
.bl{display:flex;justify-content:space-between;font-size:12.5px}.bl em{font-style:normal;color:var(--muted)}
.bt{height:7px;background:var(--surface2);border-radius:4px;margin-top:3px;overflow:hidden}.bt i{display:block;height:100%;background:var(--sage);border-radius:4px}
.leader{text-align:center;margin-top:12px}.leader small{color:var(--muted);display:block}.leader b{font-family:var(--disp);font-size:28px;color:var(--terra)}
.hs{font-size:13.5px;color:var(--muted);white-space:nowrap}.hs.w{color:var(--olive);font-weight:800}
/* navegação */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:14px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--olive)}.tabs button.on svg{stroke-width:2.2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:88%;text-align:center}
/* boas-vindas */
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px 28px;text-align:center}
.mark{width:84px;height:84px;margin:0 auto 4px;border-radius:28px;background:var(--sage-soft);display:grid;place-items:center}
.mark svg{width:52px;height:52px;fill:none;stroke:var(--olive);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.welcome h1{font-size:36px;color:var(--olive)}.welcome p{margin:0 0 10px;font-size:19px;color:var(--muted)}
.btn.big{min-height:60px;font-size:18px;border-radius:18px}.btn.alt{background:var(--earth);color:#fff}
.welcome small{color:var(--muted);margin-top:8px}

.mgrid{gap:10px;margin-top:8px}.mc{text-align:center;display:flex;flex-direction:column;align-items:center}
.big2{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1.1;color:var(--olive)}
.mc small{color:var(--muted);font-size:12.5px}
.mlead{text-align:center;font-family:var(--disp);font-weight:700;font-size:20px;color:var(--terra);margin:8px 0}
.plines{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:13.5px}.plines b.pos{color:var(--olive)}.plines b.neg{color:var(--terra)}
</style>
</head>

<div id="app"></div>
<script>
/* ============ 1. DADOS — plano alimentar estruturado a partir do PDF (prescrito em 01/10/2026) ============ */
const MEALS=[{id:'cafe',nome:'Café da manhã'},{id:'almoco',nome:'Almoço'},{id:'lanche',nome:'Lanche'},{id:'jantar',nome:'Jantar'}];

// S = opção de substituição ; it = item do plano. c = quantidade para compra {q,u}; u: g | ml | un | fatia | lata
const SB=(nome,porcao,q,u)=>({nome,porcao,c:{q,u}});

const FRUTAS=[
 SB('Goiaba','1 unidade média (130g)',130,'g'),SB('Banana','1 unidade média (80g)',80,'g'),
 SB('Mamão papaia','½ unidade média (155g)',155,'g'),SB('Mamão formosa','150g',150,'g'),
 SB('Maçã','1 unidade média (100g)',100,'g'),SB('Kiwi','1 unidade média (90g)',90,'g'),
 SB('Pera','1 unidade média (110g)',110,'g'),SB('Melancia','2 fatias pequenas (200g)',200,'g'),
 SB('Uva','15 unidades médias (120g)',120,'g'),SB('Morango','10 unidades grandes (200g)',200,'g'),

 SB('Abacaxi','2 fatias médias (150g)',150,'g'),SB('Abacate','2 colheres de sopa cheias (90g)',90,'g'),
 SB('Pêssego','3 unidades médias (180g)',180,'g'),SB('Coco seco ralado','1 colher de sobremesa cheia (10g)',10,'g'),
 SB('Ameixa','4 unidades pequenas (136g)',136,'g'),SB('Caqui','100g',100,'g'),

 SB('Figo seco','3 unidades (21g)',21,'g'),SB('Ameixa seca','4 unidades médias (20g)',20,'g'),
 SB('Uva passa preta','2 colheres de sopa rasas (20g)',20,'g')];

const SUB_PAO25=[SB('Torrada light','6 unidades · 1 pacotinho (18g)',6,'un'),SB('Biscoito de arroz','7 unidades (17,5g)',7,'un'),
 SB('Goma de tapioca/polvilho','1 colher de sopa cheia (20g)',20,'g'),SB('Pão francês','½ unidade (25g)',0.5,'un')];

 SB('Queijo cottage','2 colheres de sopa (50g)',50,'g')];
const SUB_COTTAGE=[...SUB_REQ.slice(0,2),SB('Queijo cottage','2 colheres de sopa (50g)',50,'g'),SB('Ricota','½ fatia grande (25g)',25,'g'),
 SB('Queijo minas frescal light','1 fatia pequena (20g)',20,'g'),SB('Queijo prato/muçarela','1 fatia pequena (10g)',10,'g')];
const SUB_CLARA=[SB('Queijo cottage','2 colheres de sopa (50g)',50,'g'),SB('Ricota','½ fatia grande (25g)',25,'g'),SB('Queijo minas frescal light','1 fatia pequena (20g)',20,'g')];
const SUB_REQ3=[...SUB_REQ,SB('Queijo minas frescal light','1 fatia pequena (20g)',20,'g')];

const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parseIso(iso);d.setDate(d.getDate()+n);return isoDate(d)};
const weekStartOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return isoDate(x)};
const diffDays=(a,b)=>Math.round((parseIso(b)-parseIso(a))/864e5);
const fmtBR=iso=>{const [,m,d]=iso.split('-');return `${d}/${m}`};
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');

/* gramas por unidade: só o que o plano informa ("1 unidade média (80g)") ou o que vocês definirem */
const GPU_PLAN=(()=>{const m={};const take=(nome,porcao,c)=>{if(!c||c.u!=='g')return;
  const r=/^(½|\d+(?:,\d+)?)\s*unidades?\b[^()]*\((\d+(?:,\d+)?)\s*g\)/i.exec(porcao||'');if(!r)return;
  const n=r[1]==='½'?0.5:parseFloat(r[1].replace(',','.')),g=parseFloat(r[2].replace(',','.'));
  if(n>0&&g>0)m[slug(canon(nome))]=Math.round(g/n*10)/10};
  for(const k in PLAN_V1.meals)for(const o of PLAN_V1.meals[k])for(const x of o.itens){take(x.nome,x.porcao,x.c);for(const y of x.sub)take(y.nome,y.porcao,y.c)}
  return m})();
const PLAN_KEYS=(()=>{const st=new Set();const add=(n,c)=>{if(c)st.add(slug(canon(n)))};
  for(const k in PLAN_V1.meals)for(const o of PLAN_V1.meals[k])for(const x of o.itens){add(x.nome,x.c);for(const y of x.sub)add(y.nome,y.c)}return st})();
function gpuOf(nome){const k=slug(canon(nome)),u=S.d.gpu&&Number(S.d.gpu[k]);return (u>0?u:null)||GPU_PLAN[k]||null}
function unTxt(q,u,nome){if(u!=='g')return '';const g=gpuOf(nome);return g?'≈ '+Math.ceil(q/g-1e-9)+' un':''}
const toGrams=v=>v.u==='g'?v.q:(v.u==='un'&&gpuOf(v.nome)?v.q*gpuOf(v.nome):0);
const isLooseVeg=nome=>{const k=slug(canon(nome));return k!==POOL_SLUG&&!PLAN_KEYS.has(k)&&catOf(nome)==='Verduras e legumes'};
const num=x=>String(Math.round(x*100)/100).replace('.',',');
const UNIDADES={g:'g',ml:'ml',un:'un',fatia:'fatia(s)',lata:'lata(s)',kg:'kg',L:'L',pacote:'pacote(s)'};
function fmtQty(q,u){
  q=Math.round(q*100)/100;
  if(u==='g')return q>=1000?num(Math.round(q)/1000)+' kg':num(q)+' g';
  if(u==='ml')return q>=1000?num(Math.round(q)/1000)+' L':num(q)+' ml';
  return num(q)+' '+(UNIDADES[u]||u);
}
const EPS=0.001;
const slotKey=(d,m,who)=>`s_${d}_${m}_${who}`;
const modeKey=(d,m,who)=>who?`m_${d}_${m}_${who}`:`m_${d}_${m}`;
const getMode=(week,d,m,who)=>week[modeKey(d,m,who)]||week[modeKey(d,m)]||'cook';

/* itens efetivos de uma refeição escolhida (com substituições aplicadas) */
function findOption(plan,mealId,optId){return ((plan&&plan.meals[mealId])||[]).find(o=>o.id===optId)}
function effectiveItems(plan,mealId,sel){
  const opt=findOption(plan,mealId,sel&&sel.opt); if(!opt)return [];
  const out=opt.itens.map((x,i)=>{
    const s=sel.subs&&sel.subs['i'+i];
    return s?{nome:s.n,porcao:s.p,c:s.c,subst:true,de:x.nome,idx:i}:{nome:x.nome,porcao:x.porcao,c:x.c,subst:false,idx:i};
  });
  return out;
}
const especialCount=(week,who)=>{let n=0;for(let d=0;d<7;d++)for(const m of MEALS){const s=week[slotKey(d,m.id,who)];if(s&&/Esp$/.test(s.opt||''))n++}return n};

/* 1) calcular planejamento -> necessidades consolidadas por ingrediente */
function calcNeeds(weeks,plans,only){
  const acc={};let cook=0,order=0,vazio=0;
  for(const week of weeks)for(let d=0;d<7;d++)for(const m of MEALS){
    let any=false;
    for(const who of ['c','j']){
      if(only&&who!==only)continue;
      const sel=week[slotKey(d,m.id,who)]; if(!sel||!sel.opt)continue; any=true;
      const mode=getMode(week,d,m.id,who);
      if(mode==='cook')cook++;else order++;
      if(mode!=='cook')continue;
      for(const x of effectiveItems(plans[who],m.id,sel)){
        if(!x.c)continue;
        const nome=canon(x.nome),k=keyOf(nome,x.c.u);
        (acc[k]=acc[k]||{key:k,nome,u:x.c.u,q:0}).q+=x.c.q;
      }
    }
    if(!any)vazio++;
  }
  return {needs:acc,cook,order,vazio};
}

/* 2) consolidar compras: necessidade - estoque (descontando o que já foi comprado nesta semana) */
function buildShopping(needs,stock,buy){
  const all={...needs};
  for(const k in buy){if(k.startsWith('e_')){const e=buy[k],key=k.slice(2);if(e&&e.q>0&&!all[key])all[key]={key,nome:e.nome,u:e.u,q:0}}}
  const rows=Object.values(all).map(n=>{
    const extra=(buy['e_'+n.key]&&buy['e_'+n.key].q)||0,need=n.q+extra;
    const est=(stock[n.key]&&stock[n.key].q)||0;
    const bought=(buy['b_'+n.key]&&buy['b_'+n.key].q)||0;
    const base=Math.max(0,est-bought);          // estoque antes das compras
    const toBuy=Math.max(0,need-base);
    let status='buy',falta=Math.max(0,toBuy-bought);
    if(bought>0&&falta<=EPS)status='bought'; else if(toBuy<=EPS)status='enough';
    return {...n,plan:n.q,extra,q:need,est,base,toBuy,bought,falta,status};
  });
  rows.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return rows;
}
/* 3) registrar compra / desfazer: devolve o novo estoque e o novo registro de compra */
function applyPurchase(row,stockEntry){
  const add=row.falta; const curQ=(stockEntry&&stockEntry.q)||0;
  return {stock:{...(stockEntry||{}),nome:row.nome,u:row.u,q:round3(curQ+add)},buy:{nome:row.nome,u:row.u,q:round3(row.bought+add)}};
}
function undoPurchase(row,stockEntry){
  const curQ=(stockEntry&&stockEntry.q)||0;
  return {stock:{...(stockEntry||{}),nome:row.nome,u:row.u,q:round3(Math.max(0,curQ-row.bought))},buy:{nome:row.nome,u:row.u,q:0}};
}
const round3=x=>Math.round(x*1000)/1000;

/* 4) score (pesos configuráveis) */
const CFG_PADRAO={pesos:{alim:40,ativ:40,reg:20},metaAtiv:3,pontosPorPct:5};
function diasDecorridos(weekStart,hojeIso){const d=diffDays(weekStart,hojeIso)+1;return Math.max(0,Math.min(7,d))}
function weekScore(dia,act,cfg,weekStart,hojeIso){
  cfg=cfg&&cfg.pesos?cfg:CFG_PADRAO;
  const dias=diasDecorridos(weekStart,hojeIso);
  let ok=0,diasReg=0;
  for(let d=0;d<dias;d++){let reg=false;for(const m of MEALS){const v=dia[`${d}_${m.id}`];if(v==='ok'){ok++;reg=true}else if(v==='no')reg=true}if(reg)diasReg++}
  const alim=dias?ok/(dias*MEALS.length):0;
  const datas=new Set(Object.entries(act).filter(([k,v])=>k[0]==='a'&&v&&v.d&&v.d>=weekStart&&v.d<=addDays(weekStart,6)).map(([,v])=>v.d));
  const ativ=Math.min(1,datas.size/Math.max(1,cfg.metaAtiv||3));
  const reg=dias?diasReg/dias:0;
  const p=cfg.pesos,tot=(p.alim+p.ativ+p.reg)||1;
  const pontos=Math.round((p.alim*alim+p.ativ*ativ+p.reg*reg)/tot*100);
  return {pontos,alim,ativ,reg,refeicoesOk:ok,diasTreino:datas.size,dias};
}

/* 5) peso mensal: perda gera bônus, ganho gera penalidade (pontos por 1% do peso do mês anterior) */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesKey=iso=>iso.slice(0,7);
const prevMesKey=k=>{let [y,m]=k.split('-').map(Number);m--;if(m===0){m=12;y--}return y+'-'+pad(m)};
const mesLabel=k=>{const [y,m]=k.split('-');return MESES[+m-1]+'/'+y};
const round1=x=>Math.round(x*10)/10;
function mondaysOfMonth(k,hojeIso){
  const out=[];const ini=k+'-01';let w=weekStartOf(parseIso(ini));if(w<ini)w=addDays(w,7);
  while(w.slice(0,7)===k&&w<=hojeIso){out.push(w);w=addDays(w,7)}
  return out;
}
function pesoBonus(doc,mes,pontosPorPct){
  const pp=pontosPorPct==null?5:pontosPorPct,cur=doc['m_'+mes],prev=doc['m_'+prevMesKey(mes)];
  if(!cur)return {estado:'sem',pontos:0};
  if(!prev)return {estado:'base',kg:cur.kg,pontos:0};
  const dkg=cur.kg-prev.kg,pct=dkg/prev.kg*100;
  return {estado:'ok',kg:cur.kg,prevKg:prev.kg,dkg:round1(dkg),pct:round1(pct),pontos:round1(-pct*pp)};
}

/* Cada documento é uma linha (path, data jsonb). Os valores dos campos são JSON em string,
   então o merge raso do banco (data || novo) substitui o campo inteiro. */
const Store=(()=>{
  let mode='local',canWrite=true,timer=null,busy=false;
  const mem={},listeners={},queues={},subs={},psubs={},plisteners={};
  const enc=v=>JSON.stringify(v===undefined?null:v);
  const decDoc=raw=>{if(!raw)return {};const o={};for(const k in raw){const v=raw[k];if(typeof v==='string'){try{o[k]=JSON.parse(v)}catch(e){o[k]=v}}else o[k]=v}for(const k in o)if(o[k]===null)delete o[k];return o};
  const queue=(path,fn)=>{const p=(queues[path]||Promise.resolve()).catch(()=>{}).then(fn);queues[path]=p;return p};
  const snapPrefix=pre=>{const o={};for(const p in mem)if(p.startsWith(pre))o[p]={...mem[p]};return o};
  const notify=p=>{(listeners[p]||[]).forEach(f=>f({...(mem[p]||{})}));for(const pre in plisteners)if(p.startsWith(pre))plisteners[pre].forEach(f=>f(snapPrefix(pre)))};
  const H=()=>{const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;return h};
  const api=async(path,opt={})=>{const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{...opt,headers:{...H(),...(opt.headers||{})}});if(!r.ok){if(r.status===401||r.status===403)canWrite=false;const e=new Error('http '+r.status);e.code=r.status;throw e}return r.status===204?null:r.json().catch(()=>null)};
  const inList=ps=>'('+ps.map(p=>'"'+p.replace(/"/g,'')+'"').join(',')+')';
  async function poll(){
    const ps=Object.keys(subs),pres=Object.keys(psubs);if((!ps.length&&!pres.length)||busy)return;busy=true;
    try{
      for(const pre of pres){const rows=await api('docs?select=path,data&path=like.'+encodeURIComponent(pre+'*'));const o={};(rows||[]).forEach(r=>o[r.path]=decDoc(r.data));const sig=JSON.stringify(rows||[]),s2=psubs[pre];if(s2&&s2.sig!==sig){s2.sig=sig;s2.cbs.forEach(f=>f(o))}}
      if(!ps.length){busy=false;return}
      const rows=await api('docs?select=path,data&path=in.'+encodeURIComponent(inList(ps)));
      const by={};(rows||[]).forEach(r=>by[r.path]=r.data);
      ps.forEach(p=>{const sig=JSON.stringify(by[p]||null),s=subs[p];if(s&&s.sig!==sig){s.sig=sig;s.cbs.forEach(f=>f(decDoc(by[p])))}});
    }catch(e){console.warn('poll',e)}
    busy=false;
  }
  return {
    async init(){
      if(SUPABASE_URL&&SUPABASE_KEY){
        try{await api('docs?select=path&limit=1');mode='shared'}catch(e){mode='local';console.warn(e)}
      }
      if(mode==='shared'){timer=setInterval(poll,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})}
      return mode;
    },
    get mode(){return mode},
    get canWrite(){return canWrite},
    markReadOnly(){canWrite=false},
    sub(path,cb){
      if(mode==='shared'){
        const s=subs[path]=subs[path]||{cbs:[],sig:undefined};s.cbs.push(cb);
        setTimeout(poll,0);
        return ()=>{const x=subs[path];if(!x)return;x.cbs=x.cbs.filter(f=>f!==cb);if(!x.cbs.length)delete subs[path]};
      }
      (listeners[path]=listeners[path]||[]).push(cb);setTimeout(()=>cb({...(mem[path]||{})}),0);
      return ()=>{listeners[path]=(listeners[path]||[]).filter(f=>f!==cb)};
    },
    subPrefix(pre,cb){
      if(mode==='shared'){
        const s2=psubs[pre]=psubs[pre]||{cbs:[],sig:undefined};s2.cbs.push(cb);
        setTimeout(poll,0);
        return ()=>{const x=psubs[pre];if(!x)return;x.cbs=x.cbs.filter(f=>f!==cb);if(!x.cbs.length)delete psubs[pre]};
      }
      (plisteners[pre]=plisteners[pre]||[]).push(cb);setTimeout(()=>cb(snapPrefix(pre)),0);
      return ()=>{plisteners[pre]=(plisteners[pre]||[]).filter(f=>f!==cb)};
    },
    async get(path){
      if(mode==='shared'){const r=await api('docs?select=data&path=in.'+encodeURIComponent(inList([path])));return r&&r[0]?decDoc(r[0].data):{}}
      return {...(mem[path]||{})};
    },
    put(path,fields){
      return queue(path,async()=>{
        if(mode==='shared'){
          const body={};for(const k in fields)body[k]=enc(fields[k]);
          await api('rpc/merge_doc',{method:'POST',body:JSON.stringify({p_path:path,p_fields:body})});
          poll();
        }else{mem[path]=mem[path]||{};for(const k in fields){if(fields[k]===null)delete mem[path][k];else mem[path][k]=fields[k]}notify(path)}
      });
    },
    del(path){return queue(path,async()=>{if(mode==='shared'){await api('docs?path=in.'+encodeURIComponent(inList([path])),{method:'DELETE'});poll()}else{delete mem[path];notify(path)}})}
  };
})();

/* semanas planejadas, da semana atual em diante (a visualizada usa o dado mais recente) */
function plannedWeeks(){

  for(const [p,doc] of Object.entries(S.allWeeks)){const w=p.slice(5);if(w>=from)out.push({w,doc:w===S.week?S.d.week:doc})}
  if(S.week>=from&&!out.some(x=>x.w===S.week))out.push({w:S.week,doc:S.d.week});
  return out.sort((a,b)=>a.w<b.w?-1:1);
}
function derive(){
  const r=calcNeeds(plannedWeeks().map(x=>x.doc),plansNow(),S.shopView==='c'||S.shopView==='j'?S.shopView:null);
  const rows=buildShopping(r.needs,S.d.stock,S.d.buy);
  const manual=Object.entries(S.d.buy).filter(([k,v])=>k.startsWith('x_')&&v).map(([k,v])=>({id:k.slice(2),...v}));
  /* salada e legumes: o mínimo do plano é abatido pelo que há de legumes/verduras no estoque e na lista */
  const pool=rows.find(x=>x.key===POOL_KEY);
  if(pool){
    let have=0,pend=0;
    for(const v of Object.values(S.d.stock))if(v&&v.nome&&isLooseVeg(v.nome))have+=toGrams(v);
    for(const x of manual)if(!x.done&&isLooseVeg(x.nome))pend+=toGrams(x);
    Object.assign(pool,{pool:true,est:have,base:have,pend,bought:0,toBuy:Math.max(0,pool.q-have-pend)});
    pool.falta=pool.toBuy;pool.status=pool.toBuy<=EPS?'enough':'buy';
  }
  return {...r,rows,manual};
}

  setOpt:({d,m,who,opt})=>{const old=getSel(d,m,who);S.sheet=null;render();return guarded(()=>putWeek({[slotKey(d,m,who)]:{opt,subs:{},doce:!!(old&&old.doce)}}))},
  subs:({d,m,who,i})=>{S.sheet={t:'subs',d:Number(d),m,who,open:i===undefined?-1:Number(i)};render()},

    const sel=getSel(d,m,who);if(!sel)return;

    return guarded(()=>putWeek({[slotKey(d,m,who)]:{...sel,subs:ns}}));

    d=Number(d);

    S.confirmDay=null;const f={};
    for(const m of MEALS){f[modeKey(d,m.id)]=null;for(const who of ['c','j']){f[slotKey(d,m.id,who)]=null;f[modeKey(d,m.id,who)]=null}}
    render();return guarded(async()=>{await putWeek(f);toast('Escolhas do dia removidas.')});
  },
  buyEdit:({key})=>{S.sheet={t:'buyEdit',key};render()},
  vegOpen:()=>{S.sheet={t:'veg'};render()},
  buyEditSave:({key,clear})=>{
    const r=derive().rows.find(x=>x.key===key);if(!r)return;
    const par=v=>parseFloat(String(v||'').replace(',','.'));
    let extra=clear?0:par($('f-extra').value);if(!(extra>0))extra=0;
    const k=slug(canon(r.nome)),gIn=$('f-gpu')?par($('f-gpu').value):NaN;
    const gNow=gIn>0?gIn:gpuOf(r.nome),eu=$('f-eu')?$('f-eu').value:r.u;
    if(eu==='un'&&r.u==='g'&&extra>0){if(!gNow){toast('Informe o peso de 1 unidade (g) para comprar por unidade.');return}extra=extra*gNow}
    const cat=$('f-cat')?$('f-cat').value:null;
    S.sheet=null;render();
    return guarded(async()=>{
      await Store.put('buy/all',{['e_'+key]:extra>0?{nome:r.nome,u:r.u,q:round3(extra)}:null});
      if($('f-gpu')||gIn>0)await Store.put('couple/gpu',{[k]:gIn>0&&gIn!==GPU_PLAN[k]?gIn:null});
      if(cat)await Store.put('couple/cat',{[k]:cat===autoCat(r.nome)?null:cat});
    });
  },
  vegAdd:()=>{
    const par=v=>parseFloat(String(v||'').replace(',','.')),f={};let n=0;const t=Date.now();
    for(const v of VEG_COMUNS){const q=par($('v-'+slug(v)).value);if(q>0){f['x_'+t.toString(36)+(n++)]={nome:v,q,u:'g',done:false}}}
    const on=($('v-outro-n').value||'').trim(),oq=par($('v-outro-q').value);
    if(on&&oq>0)f['x_'+t.toString(36)+(n++)]={nome:on,q:oq,u:'g',done:false};
    const ex=par($('v-extra').value),cur=(S.d.buy['e_'+POOL_KEY]&&S.d.buy['e_'+POOL_KEY].q)||0,newEx=ex>0?ex:0;
    if(newEx!==cur)f['e_'+POOL_KEY]=newEx>0?{nome:POOL_NOME,u:'g',q:newEx}:null;
    if(!Object.keys(f).length){toast('Informe pelo menos uma quantidade.');return}

  showBought:()=>{S.showBought=!S.showBought;render()},
  clearSel:({d,m,who})=>guarded(()=>putWeek({[slotKey(d,m,who)]:null})),
  same:({d,m})=>{const c=getSel(d,m,'c');if(!c)return;const opt=findOption(getPlan('j'),m,c.opt);if(!opt){toast('A opção da Carol não existe no plano do Júlio.');return}return guarded(()=>putWeek({[slotKey(d,m,'j')]:{...c}}))},
  buyToggle:({key})=>{
    const row=derive().rows.find(r=>r.key===key);if(!row||row.pool)return;

      if(row.status==='bought'){const r=undoPurchase(row,st);await Store.put('stock/main',{[key]:r.stock});await Store.put('buy/all',{['b_'+key]:r.buy})}
      else if(row.status==='buy'){const r=applyPurchase(row,st);await Store.put('stock/main',{[key]:r.stock});await Store.put('buy/all',{['b_'+key]:r.buy})}
    });
  },
  manualToggle:({id})=>{
    const x=S.d.buy['x_'+id];if(!x)return;const key=keyOf(x.nome,x.u),st=S.d.stock[key]||{nome:x.nome,u:x.u,q:0};
    return guarded(async()=>{
      const q=round3(Math.max(0,st.q+(x.done?-x.q:x.q)));

  stockOpen:({key})=>{S.sheet={t:'stock',key:key||null};render()},
  stockSave:()=>{

  dia:({d,m,val})=>{const cur=S.d.dia[S.user][`${d}_${m}`];return guarded(()=>Store.put(`dia/${S.user}-${S.week}`,{[`${d}_${m}`]:cur===val?null:val}))},
  actOpen:()=>{S.sheet={t:'act',tipo:ATIVIDADES[0],data:addDays(S.week,S.day)};render()},

  pesoOpen:()=>{S.sheet={t:'peso',mes:mesKey(S.week)};render()},
  pesoSave:()=>{
    const kg=parseFloat(($('f-kg').value||'').replace(',','.'));
    if(!(kg>20&&kg<400)){toast('Informe o peso em kg, por exemplo 68,4.');return}

    if(pesos.alim+pesos.ativ+pesos.reg<=0){toast('Os pesos precisam somar mais que zero.');return}
    return guarded(async()=>{const pp=parseFloat(($('w-pp').value||'').replace(',','.'));await Store.put('couple/cfg',{pesos,metaAtiv:Math.max(1,g('w-meta')),pontosPorPct:pp>=0?pp:5});toast('Regras do score salvas.')});

  demoClearGo:()=>{

    return guarded(async()=>{for(const p of docs)await Store.del(p);await Store.del('couple/meta');toast('Dados de exemplo removidos.')});

function normUnit(q,u){if(u==='kg')return {q:q*1000,u:'g'};if(u==='L')return {q:q*1000,u:'ml'};return {q,u}}
function onPdf(who,file){
  if(!file)return;
  const e=planEntry(who),ids=Object.keys(e.versions).map(k=>parseInt(k.slice(1),10)||1),n=Math.max(...ids)+1,vid='v'+n;
  guarded(async()=>{
    await Store.put('plans/main',{[NOMES_PLANO[who]]:{...e,versions:{...e.versions,[vid]:{nome:'Plano v'+n,src:'db',status:'pendente',arquivo:file.name,criadoEm:today()}}}});
    toast('PDF registrado como Plano v'+n+'. Envie o arquivo no chat para estruturar.');
  });
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(S.menu&&!ev.target.closest('.menu')){S.menu=false;render()}return}
  const f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.pdf)onPdf(t.dataset.pdf,t.files&&t.files[0])});

const semana=()=>`${fmtBR(S.week)} a ${fmtBR(addDays(S.week,6))}`;

function weekBar(){
  const atual=S.week===weekStartOf(new Date());
  return `<div class="weekbar"><button class="icon-btn" aria-label="Semana anterior" data-act="week" data-dir="-1">‹</button>
  <div class="weeklabel"><b>Semana de ${semana()}</b>${atual?'<small>semana atual</small>':'<button class="link" data-act="weekToday">voltar para hoje</button>'}</div>
  <button class="icon-btn" aria-label="Próxima semana" data-act="week" data-dir="1">›</button></div>`;
}
function dayStrip(){
  const t=today();
  return `<div class="days" role="tablist">${DIAS_CURTO.map((n,i)=>{const iso=addDays(S.week,i);
    return `<button class="day ${S.day===i?'on':''} ${iso===t?'today':''}" data-act="day" data-i="${i}" aria-label="${DIAS[i]} ${fmtBR(iso)}"><span>${n}</span><b>${iso.slice(8)}</b></button>`}).join('')}</div>`;
}

/* ---- Planejamento ---- */
function personBlock(d,m,who,mode){
  const sel=getSel(d,m.id,who),plan=getPlan(who);
  const seg=`<div class="seg" role="group" aria-label="Cozinhar ou pedir, ${nomeDe(who)}"><button class="${mode==='cook'?'on':''}" data-act="mode" data-d="${d}" data-m="${m.id}" data-who="${who}" data-val="cook">Cozinhar</button><button class="${mode==='order'?'on':''}" data-act="mode" data-d="${d}" data-m="${m.id}" data-who="${who}" data-val="order">Pedir</button></div>`;
  const head=`<div class="pname-row"><div class="pname"><span class="dot ${who}"></span>${nomeDe(who)}</div>${seg}</div>${mode==='order'?'<p class="note">Pedido: esta refeição não entra na lista de compras.</p>':''}`;
  if(!sel||!findOption(plan,m.id,sel.opt))
    return `<div class="pbox">${head}<button class="btn ghost wide" data-act="pickOpt" data-d="${d}" data-m="${m.id}" data-who="${who}">Escolher opção</button>${who==='j'&&getSel(d,m.id,'c')?`<button class="link" data-act="same" data-d="${d}" data-m="${m.id}">Igual à Carol</button>`:''}</div>`;
  const opt=findOption(plan,m.id,sel.opt),items=effectiveItems(plan,m.id,sel);
  const nsubs=opt.itens.reduce((a,x)=>a+(x.sub.length?1:0),0);
  const a={d,m:m.id,who};
  return `<div class="pbox ${mode==='order'?'ordered':''}">${head}
  <div class="optline"><b>${esc(opt.nome)}</b>${opt.especial?'<span class="tag terra">especial</span>':''}${sel.doce?'<span class="tag">momento doce</span>':''}</div>
  <ul class="items">${items.map(x=>`<li class="${x.subst?'sw':''}"><span>${esc(x.nome)}</span><em>${esc(x.porcao)}</em>${x.subst?`<small>no lugar de ${esc(x.de)}</small>`:''}</li>`).join('')}</ul>
  <div class="acts">${nsubs?`<button class="btn soft" data-act="subs" ${attrs(a)}>↔ Ver substituições</button>`:''}
  <button class="btn ghost" data-act="pickOpt" ${attrs(a)}>Trocar opção</button></div>
  <div class="acts2"><button class="link" data-act="doce" ${attrs(a)}>${sel.doce?'Remover momento doce':'+ Momento doce (20 g)'}</button>
  ${who==='j'&&getSel(d,m.id,'c')?`<button class="link" data-act="same" data-d="${d}" data-m="${m.id}">Igual à Carol</button>`:''}
  <button class="link mute" data-act="clearSel" ${attrs(a)}>Limpar</button></div></div>`;
}
function viewPlan(){
  const d=S.day;
  const cards=MEALS.map(m=>`<section class="card meal"><div class="meal-h"><h3>${m.nome}</h3></div>
    ${personBlock(d,m,'c',getMode(S.d.week,d,m.id,'c'))}${personBlock(d,m,'j',getMode(S.d.week,d,m.id,'j'))}</section>`).join('');
  const esp=['c','j'].map(w=>({w,n:especialCount(S.d.week,w)})).filter(x=>x.n>0);
  const lim=PLAN_V1.especialLimite;
  const temDia=MEALS.some(m=>['c','j'].some(w=>getSel(d,m.id,w)));
  const cd=S.confirmDay===d;
  return `${weekBar()}${dayStrip()}<div class="dayhrow"><h2 class="dayh">${DIAS[d]}, ${fmtBR(addDays(S.week,d))}</h2>${temDia?`<button class="btn ${cd?'danger':'ghost'} small" data-act="clearDay" data-d="${d}">${cd?'Toque para confirmar':'Limpar dia'}</button>`:''}</div>${cards}
  ${esp.length?`<p class="foot">Refeições especiais na semana: ${esp.map(x=>`${nomeDe(x.w)} ${x.n} de ${lim}`).join(' · ')}${esp.some(x=>x.n>lim)?'. O plano permite até 2 por semana.':''}</p>`:''}`;
}
function sheetOpt(sh){
  const plan=getPlan(sh.who),cur=getSel(sh.d,sh.m,sh.who);
  const nEsp=especialCount(S.d.week,sh.who)-(cur&&/Esp$/.test(cur.opt)?1:0);
  const ops=plan.meals[sh.m].map(o=>{
    const prev=o.itens.filter(x=>x.c||o.especial).slice(0,4).map(x=>x.nome.split(' (')[0]).join(', ');
    const warn=o.especial&&nEsp>=(plan.especialLimite||2);
    return `<button class="optcard ${cur&&cur.opt===o.id?'on':''}" data-act="setOpt" data-d="${sh.d}" data-m="${sh.m}" data-who="${sh.who}" data-opt="${o.id}"><b>${esc(o.nome)}</b><span>${o.especial?'Substitui uma refeição, até 2 vezes por semana, até 600 kcal':esc(prev)}</span>${warn?'<small>Já são 2 nesta semana, o limite do plano.</small>':''}</button>`}).join('');
  const prep=(findOption(plan,sh.m,cur&&cur.opt)||{}).prep||[];
  return `<h3>${MEALS.find(m=>m.id===sh.m).nome} · ${nomeDe(sh.who)}</h3><p class="muted">${DIAS[sh.d]}. Escolha a opção do plano.</p><div class="optlist">${ops}</div>`;
}
function sheetSubs(sh){
  const plan=getPlan(sh.who),sel=getSel(sh.d,sh.m,sh.who);if(!sel)return '<p>Sem refeição escolhida.</p>';
  const opt=findOption(plan,sh.m,sel.opt);
  const base={d:sh.d,m:sh.m,who:sh.who};
  const acc=opt.itens.map((x,i)=>{
    if(!x.sub.length)return '';
    const cur=sel.subs&&sel.subs['i'+i];
    const rows=x.sub.map((s,j)=>({s,j})).filter(({s})=>!(s.nome===x.nome&&s.porcao===x.porcao)).map(({s,j})=>{
      const on=cur&&cur.n===s.nome&&cur.p===s.porcao;
      return `<button class="subrow ${on?'on':''}" data-act="setSub" ${attrs({...base,i,s:j})}><span>${esc(s.nome)}</span><em>${esc(s.porcao)}</em></button>`}).join('');
    return `<details class="acc" ${sh.open===i?'open':''}><summary><div><b>${esc(x.nome.split(' (')[0])}</b><span>${cur?`${esc(cur.n)} · ${esc(cur.p)}`:`${esc(x.porcao)}`}</span></div><i>${x.sub.length} opções</i></summary>
    <div class="subs"><button class="subrow ${cur?'':'on'}" data-act="setSub" ${attrs({...base,i,s:-1})}><span>Original: ${esc(x.nome.split(' (')[0])}</span><em>${esc(x.porcao)}</em></button>${rows}</div></details>`}).join('');
  const sem=opt.itens.filter(x=>!x.sub.length).map(x=>x.nome.split(' (')[0]);
  return `<h3>Substituições</h3><p class="muted">${MEALS.find(m=>m.id===sh.m).nome} · ${nomeDe(sh.who)} · ${esc(opt.nome)}. As porções vêm do plano; cada troca tem a sua.</p>${acc}${sem.length?`<p class="muted small">Sem substituição no plano: ${esc(sem.join(', '))}.</p>`:''}`;
}

/* ---- Compras ---- */
function chk(on,act,a,label){return `<button class="chk ${on?'on':''}" role="checkbox" aria-checked="${on}" aria-label="${esc(label)}" data-act="${act}" ${attrs(a)}><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`}
function viewShop(){
  const D=derive(),buy=D.rows.filter(r=>r.status==='buy'),got=D.rows.filter(r=>r.status==='bought'),ok=D.rows.filter(r=>r.status==='enough');
  const manPend=D.manual.filter(x=>!x.done),manDone=D.manual.filter(x=>x.done);
  const qty=(q,u,nome)=>{const t=unTxt(q,u,nome);return `${fmtQty(q,u)}${t?`<small class="un">${t}</small>`:''}`};
  const edit=r=>`data-act="buyEdit" data-key="${esc(r.key)}"`;
  const planTxt=r=>`precisa ${fmtQty(r.plan,r.u)}${r.extra?` + ${fmtQty(r.extra,r.u)} a mais`:''} · estoque ${fmtQty(r.est,r.u)}`;
  const row=r=>{
    if(r.pool)return `<li class="row"><div class="rt tap" data-act="vegOpen"><b>Salada e legumes</b><small>mínimo do plano ${fmtQty(r.plan,'g')}${r.extra?` + ${fmtQty(r.extra,'g')} a mais`:''} · em casa ${fmtQty(r.est,'g')} · na lista ${fmtQty(r.pend||0,'g')}</small></div><span class="qty">${fmtQty(r.toBuy,'g')}</span><button class="btn soft small" data-act="vegOpen">Escolher</button></li>`;
    const q=r.status==='bought'?r.bought:(r.bought>0?r.falta:r.toBuy);
    return `<li class="row ${r.status==='bought'?'done':''}">${chk(r.status==='bought','buyToggle',{key:r.key},r.nome)}
   <div class="rt tap" ${edit(r)}><b>${esc(r.nome)}</b><small>${planTxt(r)}</small></div>
   <span class="qty tap" ${edit(r)}>${qty(q,r.u,r.nome)}</span></li>`};
  const manRow=x=>`<li class="row ${x.done?'done':''}">${chk(x.done,'manualToggle',{id:x.id},x.nome)}<div class="rt"><b>${esc(x.nome)}</b><small>adicionado à mão</small></div><span class="qty">${qty(x.q,x.u,x.nome)}</span><button class="x" aria-label="Remover ${esc(x.nome)}" data-act="manualDel" data-id="${x.id}">×</button></li>`;

/* ---- Score ---- */
const sgn=x=>(x>0?'+':x<0?'−':'')+String(Math.abs(x)).replace('.',',');
const kgf=x=>String(x).replace('.',',')+' kg';
function pesoLinha(w,pb,mes){
  if(pb.estado==='sem')return `<small>${nomeDe(w)}: sem peso registrado em ${mesLabel(mes)}</small>`;
  if(pb.estado==='base')return `<small>${nomeDe(w)}: ${kgf(pb.kg)}. Falta o mês anterior para comparar.</small>`;
  return `<small>${nomeDe(w)}: ${kgf(pb.kg)} (${sgn(pb.dkg)} kg, ${sgn(pb.pct)}%) · <b class="${pb.pontos>=0?'pos':'neg'}">${sgn(pb.pontos)} pts</b></small>`;
}
function monthCard(){
  const M=monthTotals(),k=M.key,diff=M.c.total-M.j.total;
  const lider=diff===0?'Empate no mês':`${diff>0?'Carol':'Júlio'} +${Math.abs(diff)}`;
  const col=w=>`<div class="mc"><span class="dot ${w}"></span><b>${nomeDe(w)}</b><div class="big2">${M[w].total}</div><small>semanas ${M[w].sem} · peso ${sgn(M[w].peso.pontos)}</small></div>`;
  const meu=S.d.peso[S.user]['m_'+k];
  return `<section class="card"><h3>Placar de ${mesLabel(k)}</h3><div class="two mgrid">${col('c')}${col('j')}</div>
  <p class="mlead">${lider}</p>
  <div class="plines">${pesoLinha('c',M.c.peso,k)}${pesoLinha('j',M.j.peso,k)}</div>
  <button class="btn soft wide" data-act="pesoOpen">${meu?'Atualizar':'Registrar'} meu peso de ${mesLabel(k)}</button></section>`;
}
function sheetPeso(sh){
  const cur=S.d.peso[S.user]['m_'+sh.mes];

  <label class="fl">Peso (kg)<input id="f-kg" inputmode="decimal" value="${cur?String(cur.kg).replace('.',','):''}" placeholder="68,4"></label>
  <button class="btn primary wide" data-act="pesoSave">Salvar</button>${cur?'<button class="btn danger wide" data-act="pesoDel">Remover registro</button>':''}`;
}
const pct=x=>Math.round(x*100);
function scoreCard(w,s,lead){
  const p=cfg().pesos;
  const bar=(l,v,peso)=>`<div class="bar"><div class="bl"><span>${l}</span><em>${pct(v)}% · peso ${peso}</em></div><div class="bt"><i style="width:${pct(v)}%"></i></div></div>`;
  return `<section class="card sc ${lead?'lead':''}"><div class="sc-h"><span class="dot ${w}"></span>${nomeDe(w)}</div><div class="big">${s.pontos}</div><small>pontos</small>

}
function viewScore(){
  const now=today(),c=weekScore(S.d.dia.c,S.d.act.c,cfg(),S.week,now),j=weekScore(S.d.dia.j,S.d.act.j,cfg(),S.week,now);
  const diff=c.pontos-j.pontos;
  const lider=diff===0?'Empate esta semana':`${diff>0?'Carol':'Júlio'} +${Math.abs(diff)}`;
  const hist=Object.entries(S.hist).sort((a,b)=>b[0].localeCompare(a[0]));
  const hl=(a,b)=>a>b?'w':'';
  return `<h2 class="title">Score</h2>${weekBar()}
  <div class="two sc-grid">${scoreCard('c',c,diff>0)}${scoreCard('j',j,diff<0)}</div>
  <section class="card leader"><small>Quem está na frente esta semana?</small><b>${lider}</b></section>

   <li class="row"><div class="rt"><b>Semana atual</b><small>${semana()}</small></div><span class="hs ${hl(c.pontos,j.pontos)}">Carol ${c.pontos}</span><span class="hs ${hl(j.pontos,c.pontos)}">Júlio ${j.pontos}</span></li>
   ${hist.map(([w,x])=>`<li class="row"><div class="rt"><b>Semana de ${fmtBR(w)}</b><small>a ${fmtBR(addDays(w,6))}</small></div><span class="hs ${hl(x.c.pontos,x.j.pontos)}">Carol ${x.c.pontos}</span><span class="hs ${hl(x.j.pontos,x.c.pontos)}">Júlio ${x.j.pontos}</span></li>`).join('')}</ul></section>

  const banners=!S.ready?'':(Store.mode==='local'?'<div class="banner">Modo local: sem banco conectado, os dados não são salvos nem sincronizam.</div>':'')+(!Store.canWrite?'<div class="banner">Sem permissão para gravar no banco. Confira as regras (policies) do Supabase.</div>':'');
  return `<header class="top"><div class="brand">CAJU Fitness</div><div class="menu"><button class="who" data-act="userMenu" aria-expanded="${S.menu}"><span class="dot ${S.user}"></span>${nomeDe(S.user)} ▾</button>
   ${S.menu?`<div class="pop"><button data-act="switchUser">Trocar usuário</button></div>`:''}</div></header>${banners}
  <main class="view">${v}</main>
  <nav class="tabs" aria-label="Navegação">${TABS.map(([id,l,ic])=>`<button class="${S.tab===id?'on':''}" data-act="tab" data-t="${id}" ${S.tab===id?'aria-current="page"':''}>${icon(ic)}<span>${l}</span></button>`).join('')}</nav>
  ${sheet}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
}
function render(){
  const root=$('app');if(!root)return;
  const y=window.scrollY,sheetEl=root.querySelector('.sbody'),sy=sheetEl?sheetEl.scrollTop:0;
  root.innerHTML=S.user?viewShell():viewWelcome();
  document.body.classList.toggle('lock',!!S.sheet);
  if(sheetEl&&root.querySelector('.sbody'))root.querySelector('.sbody').scrollTop=sy;
  window.scrollTo(0,y);
}
async function boot(){
  render();
  await Store.init();S.ready=true;
  subscribeStatic();subscribeWeek();render();
}
boot();
</script>
</body>
</html>
